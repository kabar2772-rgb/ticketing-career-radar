<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticketing Career Radar</title><style>body{margin:0;background:#0c1421;color:#f0f5ff;font:15px system-ui}main{max-width:1050px;margin:auto;padding:32px 18px}h1{margin:0 0 6px}p,small{color:#9aadc6}section{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select{background:#192b40;color:white;border:1px solid #40506b;border-radius:8px;padding:12px}input{flex:1}.job{border:1px solid #30445c;background:#16253a;border-radius:12px;padding:18px;margin:12px 0}.score{float:right;color:#7ce4b8;font-weight:bold;font-size:22px}.tag{display:inline-block;background:#29445a;padding:5px 9px;border-radius:6px;margin:5px 5px 5px 0;font-size:12px}a{color:#85d4ff}button{background:#304b69;color:white;border:0;padding:9px;border-radius:7px;cursor:pointer}</style><main><h1>🎟 Ticketing Career Radar</h1><p>Ticketing Leadership — приоритет · Worldwide · $6,000+ (если зарплата известна) · Visa review для граждан РФ</p><small id="state">Загрузка данных…</small><section><input id="q" placeholder="Поиск по названию / компании / стране"><select id="visa"><option value="all">Все визовые статусы</option><option value="possible">Без явного ограничения</option><option value="yes">Упомянуто спонсорство</option></select><select id="status"><option value="active">Только актуальные по источнику</option><option value="all">Все, включая исчезнувшие</option></select><select id="fav"><option value="all">Все вакансии</option><option value="saved">Избранное</option></select></section><div id="results"></div></main><script>
let data=[],saved={};try{saved=JSON.parse(localStorage.getItem('career-radar-fav')||'{}')}catch(e){}const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let q=$('q').value.toLowerCase();let jobs=data.filter(j=>(j.title+' '+j.company+' '+j.location).toLowerCase().includes(q)&&($('status').value==='all'||j.status==='active')&&($('visa').value==='all'||($('visa').value==='yes'?j.visa.startsWith('Sponsorship'):!j.visa.startsWith('Work authorization')))&&($('fav').value==='all'||saved[j.id]));$('results').innerHTML=jobs.length?jobs.map(j=>`<article class="job"><span class="score">${Number(j.score)||0}/100</span><small>${esc(j.company)} · ${esc(j.location)}</small><h3>${esc(j.title)}</h3><span class="tag">${esc(j.visa)}</span><span class="tag">${esc(j.salary)}</span><span class="tag">${esc(j.status)}</span><p>Впервые: ${esc(j.first_seen?.slice(0,10))} · Проверено: ${esc(j.last_seen?.slice(0,10))}</p><a target="_blank" rel="noopener noreferrer" href="${esc(j.url)}">Открыть вакансию ↗</a> &nbsp; <button data-id="${esc(j.id)}">${saved[j.id]?'★ Сохранено':'☆ Сохранить'}</button></article>`).join(''):'<p>Вакансий пока нет. Проверь источники и запуск сборщика.</p>';$('results').querySelectorAll('button').forEach(b=>b.onclick=()=>{saved[b.dataset.id]=!saved[b.dataset.id];localStorage.setItem('career-radar-fav',JSON.stringify(saved));render()})}document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',render));fetch('./data/jobs.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(x=>{data=x.jobs||[];$('state').textContent=`Обновлено: ${x.updated||'неизвестно'} · вакансий: ${data.length} · источники: ${(x.sources||[]).map(s=>s.source+': '+s.state).join(', ')}`;render()}).catch(e=>{$('state').textContent='Данные недоступны: '+e.message+'. Откройте через веб-сервер или GitHub Pages.';render()});
</script></html>
